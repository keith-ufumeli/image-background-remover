[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bgremover"
version = "0.1.0"
description = "Simple always-available background remover: CLI and local web UI"
requires-python = ">=3.10"
dependencies = [
    "rembg[cpu]>=2.0.0",
    "typer>=0.12.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
bgremove = "bgremover.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bgremover"]
